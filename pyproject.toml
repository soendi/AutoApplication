[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoapplication"
version = "1.0.31"
description = "Stellen suchen, Bewerbungen vorbereiten und Antworten verfolgen"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AutoApplication" }]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.6", "pillow>=10"]

[project.gui-scripts]
autoapplication = "autoapplication.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
autoapplication = ["data/*.json", "data/*.png"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: Installer bauen und ans Release hängen

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v (z. B. 1.0.0): Installer bauen, danach Tag und Release anlegen. Leer = nur bauen."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows (Setup-EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow pytest

      - name: Tests
        shell: pwsh
        run: |
          # -u schreibt ungepuffert: haengt ein Test, nennt die letzte Zeile
          # im Log seinen Namen, und -v macht daraus einen lesbaren Eintrag.
          python -u -m pytest tests -v --tb=short 2>&1 | Tee-Object -FilePath tests.log
          if ($LASTEXITCODE -eq 0) { exit 0 }
          Write-Host "--- Testfehler ---"
          Get-Content tests.log -Tail 60
          $anzeige = (Get-Content tests.log -Tail 40) -join ' | '
          Write-Host "::error::Testausgabe: $anzeige"
          Select-String -Path tests.log -Pattern '^(FAILED|ERROR)\s' |
            Select-Object -First 10 |
            ForEach-Object { Write-Host "::error::$($_.Line)" }
          exit 1

      - name: Installer bauen und selbst testen
        run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1

      - name: Installer als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: AutoApplication-Setup
          path: dist/*Setup.exe
          retention-days: 7
          if-no-files-found: error

  release:
    name: Tag und Release (nach dem Installer)
    needs: [windows]
    if: github.event_name == 'push' || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fertigen Installer holen
        uses: actions/download-artifact@v4
        with:
          name: AutoApplication-Setup
          path: dist

      - name: Tag und Release anlegen, Installer anhängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          TAG_REF: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then TAG="v${INPUT_VERSION}"; else TAG="${TAG_REF}"; fi
          echo "Tag: ${TAG}"
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "AutoApplication ${TAG#v}" \
              --target "${HEAD_SHA}" \
              --notes-file docs/release-notes.md
          fi
          gh release upload "${TAG}" dist/*Setup.exe --clobber
          gh release edit "${TAG}" --notes-file docs/release-notes.md
